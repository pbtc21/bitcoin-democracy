[project]
name = "bitcoin-democracy"
description = "Bitzion: 30 sBTC-funded city-states with hyperelection governance"
authors = []
telemetry = false
cache_dir = "./.cache"
requirements = []

[contracts.sip-010-trait]
path = "contracts/sip-010-trait.clar"

[contracts.mock-sbtc]
path = "contracts/mock-sbtc.clar"
depends_on = ["sip-010-trait"]

[contracts.city-btc-token]
path = "contracts/city-btc-token.clar"
depends_on = ["sip-010-trait"]

[contracts.hyperelection]
path = "contracts/hyperelection.clar"
depends_on = ["city-btc-token"]
clarity_version = 3
epoch = "3.0"

[contracts.yield-trait]
path = "contracts/yield-trait.clar"

[contracts.mock-zest]
path = "contracts/mock-zest.clar"
depends_on = ["yield-trait", "mock-sbtc"]
clarity_version = 3
epoch = "3.0"

[contracts.treasury]
path = "contracts/treasury.clar"
depends_on = ["city-btc-token", "mock-sbtc", "mock-zest"]
clarity_version = 3
epoch = "3.0"

[contracts.board]
path = "contracts/board.clar"
depends_on = ["hyperelection", "treasury"]
clarity_version = 3
epoch = "3.0"

[contracts.democracy-factory]
path = "contracts/democracy-factory.clar"
clarity_version = 3
epoch = "3.0"

[contracts.city-btc-token-hardened]
path = "contracts/city-btc-token-hardened.clar"
depends_on = ["sip-010-trait"]
clarity_version = 3
epoch = "3.0"

[contracts.hyperelection-hardened]
path = "contracts/hyperelection-hardened.clar"
depends_on = ["city-btc-token-hardened"]
clarity_version = 3
epoch = "3.0"

[contracts.treasury-hardened]
path = "contracts/treasury-hardened.clar"
depends_on = ["city-btc-token-hardened", "mock-sbtc"]
clarity_version = 3
epoch = "3.0"

[contracts.board-hardened]
path = "contracts/board-hardened.clar"
depends_on = ["hyperelection-hardened", "treasury-hardened"]
clarity_version = 3
epoch = "3.0"

[contracts.democracy-factory-hardened]
path = "contracts/democracy-factory-hardened.clar"
clarity_version = 3
epoch = "3.0"

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
